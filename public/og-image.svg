<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171A" />
      <stop offset="100%" stop-color="#0A0B0D" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA8214" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Barber Pole Striped Accent Bar at Top -->
  <rect x="0" y="0" width="1200" height="12" fill="#DC2626" />

  <!-- Decorative Rings -->
  <circle cx="950" cy="315" r="220" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.3" stroke-dasharray="8,8" />
  <circle cx="950" cy="315" r="180" fill="none" stroke="#D4AF37" stroke-width="4" opacity="0.4" />

  <!-- Logo Placement (Right Side) -->
  <image href="/logo.svg" x="780" y="145" width="340" height="340" />

  <!-- Left Side Text & Copy -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="220" height="36" rx="18" fill="#DC2626" opacity="0.2" />
    <rect x="0" y="0" width="220" height="36" rx="18" fill="none" stroke="#DC2626" stroke-width="1.5" />
    <text x="110" y="23" font-family="sans-serif" font-weight="700" font-size="14" fill="#F87171" text-anchor="middle" letter-spacing="2">
      CARY, NC • 11 CHAIRS
    </text>

    <text x="0" y="95" font-family="sans-serif" font-weight="900" font-size="54" fill="#FFFFFF" letter-spacing="1">
      CHICAGO STYLE CUTS
    </text>
    <text x="0" y="155" font-family="sans-serif" font-weight="900" font-size="50" fill="url(#gold)" letter-spacing="1">
      BARBER SHOP
    </text>

    <text x="0" y="220" font-family="sans-serif" font-weight="500" font-size="22" fill="#CBD5E1">
      Sharp Cuts. Classic Craft. Cary's Trusted Neighborhood Barbers.
    </text>
    <text x="0" y="255" font-family="sans-serif" font-weight="400" font-size="18" fill="#94A3B8">
      Men's Haircuts $25 • Beard Trims $15-$20 • Open 7 Days • Walk-Ins Welcome
    </text>

    <g transform="translate(0, 310)">
      <text x="0" y="0" font-family="sans-serif" font-weight="700" font-size="20" fill="#FDE047">
        ★ 4.6 Stars (1,030+ Google Reviews)  |  (919) 377-2866
      </text>
      <text x="0" y="30" font-family="sans-serif" font-weight="400" font-size="16" fill="#94A3B8">
        750 E Chatham St, Cary, NC 27511
      </text>
    </g>
  </g>
</svg>
