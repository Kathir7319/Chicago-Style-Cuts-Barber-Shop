<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA8214" />
      <stop offset="100%" stop-color="#6E5005" />
    </linearGradient>

    <linearGradient id="barberRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <radialGradient id="gentDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1E24" />
      <stop offset="100%" stop-color="#0A0B0D" />
    </radialGradient>

    <filter id="gentShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <path id="archGentTop" d="M 85,250 A 165,165 0 1,1 415,250" fill="none" />
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="236" fill="url(#gentDark)" stroke="url(#gentGold)" stroke-width="7" filter="url(#gentShadow)" />
  <circle cx="250" cy="250" r="220" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="4,4" opacity="0.8" />
  <circle cx="250" cy="250" r="212" fill="none" stroke="url(#gentGold)" stroke-width="2" />
  <circle cx="250" cy="250" r="165" fill="#101317" stroke="url(#gentGold)" stroke-width="3.5" />

  <!-- Dapper Gentleman Profile Silhouette with Sharp Skin Fade & Groomed Beard -->
  <g transform="translate(250, 195) scale(0.9) translate(-250, -195)" filter="url(#gentShadow)">
    <!-- Head & Hair Silhouette -->
    <!-- Pompadour / Sleek Hair -->
    <path d="M 230,110 C 265,100 290,115 295,145 C 298,160 295,175 298,185 C 300,190 306,195 306,202 C 306,208 300,214 300,220 C 308,228 316,236 312,246 C 308,256 290,265 272,266 C 255,267 240,260 232,250 C 220,235 224,215 224,195 C 218,185 210,165 215,140 C 218,125 222,115 230,110 Z" fill="url(#gentGold)" />
    <!-- Facial Profile Cutout / Negative Space -->
    <path d="M 245,130 C 265,122 280,132 282,150 C 284,162 280,172 282,180 C 285,185 292,190 290,198 C 288,204 280,208 280,215 C 286,222 292,230 286,238 C 280,246 268,252 254,250 C 242,248 238,238 238,228 C 232,215 236,198 236,182 C 230,174 226,155 232,138 C 236,134 240,132 245,130 Z" fill="#101317" />
    
    <!-- Sharp Mustache & Beard Detail in Gold -->
    <path d="M 268,198 C 278,198 284,204 284,208 C 278,210 270,208 266,205 Z" fill="url(#gentGold)" />
    <path d="M 262,215 C 275,220 285,228 280,240 C 274,248 260,250 250,246 C 256,238 260,226 262,215 Z" fill="url(#gentGold)" />
  </g>

  <!-- Crossed Barber Shears Below Profile -->
  <g transform="translate(250, 240)" filter="url(#gentShadow)">
    <!-- Scissor Loop 1 -->
    <circle cx="-35" cy="20" r="14" fill="none" stroke="url(#gentGold)" stroke-width="4" />
    <!-- Scissor Loop 2 -->
    <circle cx="35" cy="20" r="14" fill="none" stroke="url(#gentGold)" stroke-width="4" />
    <line x1="-25" y1="12" x2="25" y2="-20" stroke="url(#gentGold)" stroke-width="4" stroke-linecap="round" />
    <line x1="25" y1="12" x2="-25" y2="-20" stroke="url(#gentGold)" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="-4" r="4" fill="#DC2626" stroke="url(#gentGold)" stroke-width="1.5" />
  </g>

  <!-- Banner Ribbon -->
  <g filter="url(#gentShadow)">
    <polygon points="60,312 90,280 90,328 60,344" fill="#7F1D1D" />
    <polygon points="440,312 410,280 410,328 440,344" fill="#7F1D1D" />
    <rect x="80" y="282" width="340" height="52" rx="6" fill="url(#barberRed)" stroke="url(#gentGold)" stroke-width="3" />
    <line x1="90" y1="288" x2="410" y2="288" stroke="url(#gentGold)" stroke-width="1" />
    <line x1="90" y1="328" x2="410" y2="328" stroke="url(#gentGold)" stroke-width="1" />
    <text x="250" y="318" font-family="'Cinzel', 'Oswald', serif" font-weight="900" font-size="27" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">
      BARBER SHOP
    </text>
  </g>

  <!-- Arch Text -->
  <text font-family="'Cinzel', 'Oswald', serif" font-weight="900" font-size="27" fill="url(#gentGold)" letter-spacing="5">
    <textPath href="#archGentTop" startOffset="50%" text-anchor="middle">
      CHICAGO STYLE CUTS
    </textPath>
  </text>

  <!-- Stars -->
  <g transform="translate(95, 235) scale(0.65)">
    <polygon points="25,0 30,15 45,15 33,25 38,40 25,30 12,40 17,25 5,15 20,15" fill="#DC2626" stroke="url(#gentGold)" stroke-width="1.5" />
  </g>
  <g transform="translate(375, 235) scale(0.65)">
    <polygon points="25,0 30,15 45,15 33,25 38,40 25,30 12,40 17,25 5,15 20,15" fill="#DC2626" stroke="url(#gentGold)" stroke-width="1.5" />
  </g>

  <!-- Bottom Details -->
  <text x="250" y="375" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#FFF0A0" text-anchor="middle" letter-spacing="3.5">
    CARY, NC  ★  11 CHAIRS  ★  EST. 2026
  </text>
  <text x="250" y="402" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#94A3B8" text-anchor="middle" letter-spacing="2">
    750 E CHATHAM ST • WALK-INS WELCOME
  </text>
</svg>
