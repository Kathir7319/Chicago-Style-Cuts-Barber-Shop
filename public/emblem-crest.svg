<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="30%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8D6E63" />
    </linearGradient>

    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <filter id="crestDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background Heraldic Shield -->
  <g filter="url(#crestDrop)">
    <!-- Outer Shield Frame -->
    <path d="M 100,70 L 400,70 Q 400,240 250,440 Q 100,240 100,70 Z" fill="url(#shieldBg)" stroke="url(#shieldGold)" stroke-width="8" />
    <!-- Inner Inset Shield -->
    <path d="M 120,90 L 380,90 Q 380,230 250,410 Q 120,230 120,90 Z" fill="#0C0E12" stroke="#D4AF37" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Barber Pole Stripes Inside Shield Header -->
    <clipPath id="shieldStripes">
      <path d="M 125,95 L 375,95 L 375,170 L 125,170 Z" />
    </clipPath>
    <g clip-path="url(#shieldStripes)" opacity="0.9">
      <polygon points="100,80 140,180 160,180 120,80" fill="#DC2626" />
      <polygon points="140,80 180,180 200,180 160,80" fill="#FFFFFF" />
      <polygon points="180,80 220,180 240,180 200,80" fill="#2563EB" />
      <polygon points="220,80 260,180 280,180 240,80" fill="#FFFFFF" />
      <polygon points="260,80 300,180 320,180 280,80" fill="#DC2626" />
      <polygon points="300,80 340,180 360,180 320,80" fill="#FFFFFF" />
      <polygon points="340,80 380,180 400,180 360,80" fill="#2563EB" />
    </g>

    <!-- Golden Divider -->
    <line x1="120" y1="170" x2="380" y2="170" stroke="url(#shieldGold)" stroke-width="4" />

    <!-- Center Crossed Shears and Straight Razor -->
    <g transform="translate(250, 245)">
      <!-- Crossed Shears & Razor in Silhouette -->
      <line x1="-70" y1="-50" x2="70" y2="50" stroke="url(#shieldGold)" stroke-width="6" stroke-linecap="round" />
      <line x1="70" y1="-50" x2="-70" y2="50" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <circle cx="-70" cy="-50" r="14" fill="none" stroke="url(#shieldGold)" stroke-width="4" />
      <circle cx="70" cy="-50" r="14" fill="none" stroke="#FFFFFF" stroke-width="4" />
      <circle cx="0" cy="0" r="8" fill="#DC2626" stroke="url(#shieldGold)" stroke-width="2" />
    </g>

    <!-- Main Shield Text -->
    <text x="250" y="145" font-family="'Cinzel', 'Oswald', serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
      CHICAGO STYLE
    </text>

    <!-- Red Banner -->
    <rect x="130" y="300" width="240" height="44" rx="6" fill="#DC2626" stroke="url(#shieldGold)" stroke-width="2.5" />
    <text x="250" y="330" font-family="'Cinzel', 'Oswald', serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
      BARBER SHOP
    </text>

    <!-- Cary NC & 11 Chairs -->
    <text x="250" y="375" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="url(#shieldGold)" text-anchor="middle" letter-spacing="3">
      CARY, NC • 11 CHAIRS
    </text>

    <text x="250" y="398" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#94A3B8" text-anchor="middle" letter-spacing="2">
      EST. 2026 • WALK-INS
    </text>
  </g>
</svg>
