<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Rich Gradients -->
    <linearGradient id="richGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF2A3" />
      <stop offset="75%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8E680E" />
    </linearGradient>

    <linearGradient id="deepRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <linearGradient id="steelBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <radialGradient id="carbonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E232A" />
      <stop offset="85%" stop-color="#0E1013" />
      <stop offset="100%" stop-color="#07080A" />
    </radialGradient>

    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arc Paths for Text -->
    <path id="archTop" d="M 80,250 A 170,170 0 1,1 420,250" fill="none" />
    <path id="archBottom" d="M 410,250 A 160,160 0 0,1 90,250" fill="none" />
  </defs>

  <!-- Base Shadow & Outer Ring -->
  <circle cx="250" cy="250" r="238" fill="url(#carbonGlow)" stroke="url(#richGold)" stroke-width="8" filter="url(#emblemShadow)" />
  
  <!-- Laurel / Beaded Outer Rim -->
  <circle cx="250" cy="250" r="222" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="3,5" opacity="0.9" />
  <circle cx="250" cy="250" r="214" fill="none" stroke="url(#richGold)" stroke-width="2.5" />
  <circle cx="250" cy="250" r="168" fill="#111418" stroke="url(#richGold)" stroke-width="4" />

  <!-- Center Decorative Sunburst Rays -->
  <g opacity="0.12" stroke="#FFF" stroke-width="1.5">
    <line x1="250" y1="90" x2="250" y2="410" />
    <line x1="90" y1="250" x2="410" y2="250" />
    <line x1="137" y1="137" x2="363" y2="363" />
    <line x1="137" y1="363" x2="363" y2="137" />
    <line x1="110" y1="190" x2="390" y2="310" />
    <line x1="110" y1="310" x2="390" y2="190" />
    <line x1="190" y1="110" x2="310" y2="390" />
    <line x1="310" y1="110" x2="190" y2="390" />
  </g>

  <!-- Barber Pole Core (Behind Tools) -->
  <g transform="translate(233, 105)" filter="url(#emblemShadow)">
    <rect x="0" y="0" width="34" height="175" rx="17" fill="#0A0B0D" stroke="url(#richGold)" stroke-width="3" />
    <clipPath id="poleClipHeritage">
      <rect x="3" y="3" width="28" height="169" rx="14" />
    </clipPath>
    <g clip-path="url(#poleClipHeritage)">
      <polygon points="0,-10 34,24 34,6 0,-28" fill="#E11D48" />
      <polygon points="0,15 34,49 34,31 0,-3" fill="#FFFFFF" />
      <polygon points="0,40 34,74 34,56 0,22" fill="#2563EB" />
      <polygon points="0,65 34,99 34,81 0,47" fill="#FFFFFF" />
      <polygon points="0,90 34,124 34,106 0,72" fill="#E11D48" />
      <polygon points="0,115 34,149 34,131 0,97" fill="#FFFFFF" />
      <polygon points="0,140 34,174 34,156 0,122" fill="#2563EB" />
      <polygon points="0,165 34,199 34,181 0,147" fill="#FFFFFF" />
    </g>
    <!-- Pole Golden Caps -->
    <ellipse cx="17" cy="5" rx="15" ry="6" fill="url(#richGold)" />
    <ellipse cx="17" cy="170" rx="15" ry="6" fill="url(#richGold)" />
    <circle cx="17" cy="-4" r="8" fill="url(#richGold)" stroke="#A17C14" stroke-width="1.5" />
    <circle cx="17" cy="179" r="8" fill="url(#richGold)" stroke="#A17C14" stroke-width="1.5" />
  </g>

  <!-- Crossed Barber Cutters -->
  <!-- Left to Right: Polished Barber Shears -->
  <g transform="translate(250, 195) rotate(-38) translate(-250, -195)" filter="url(#emblemShadow)">
    <!-- Blades -->
    <path d="M 244,70 L 253,195 L 247,208 L 241,195 Z" fill="url(#steelBlade)" stroke="#111" stroke-width="1" />
    <!-- Golden Pivot -->
    <circle cx="248" cy="198" r="6" fill="url(#richGold)" stroke="#333" stroke-width="1.5" />
    <!-- Ergonomic Finger Handles -->
    <path d="M 243,208 Q 230,245 220,270 A 18,18 0 1,0 244,286 Q 248,250 248,208 Z" fill="none" stroke="url(#richGold)" stroke-width="7" stroke-linecap="round" />
    <circle cx="218" cy="285" r="3.5" fill="#C59B27" />
  </g>

  <!-- Right to Left: Open Straight Razor -->
  <g transform="translate(250, 195) rotate(38) translate(-250, -195)" filter="url(#emblemShadow)">
    <!-- Razor Hollow Ground Blade -->
    <path d="M 246,65 C 246,65 264,85 264,185 L 247,198 Z" fill="url(#steelBlade)" stroke="#111" stroke-width="1.2" />
    <path d="M 258,85 L 258,175" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8" />
    <!-- Pivot Screw -->
    <circle cx="248" cy="198" r="6" fill="url(#richGold)" stroke="#000" stroke-width="1.5" />
    <!-- Vintage Pearlescent Wood/Horn Handle -->
    <path d="M 248,198 C 242,235 236,275 238,305 C 240,314 250,314 252,305 C 255,270 254,230 248,198 Z" fill="#241B15" stroke="url(#richGold)" stroke-width="3" />
    <!-- Golden inlay pin on handle -->
    <circle cx="246" cy="265" r="3" fill="url(#richGold)" />
  </g>

  <!-- Center Gem Stud -->
  <circle cx="250" cy="195" r="7" fill="url(#deepRed)" stroke="url(#richGold)" stroke-width="2.5" />

  <!-- Deluxe 3D Curved Ribbon Banner: "BARBER SHOP" -->
  <g filter="url(#emblemShadow)">
    <!-- Banner Ribbons Ends -->
    <path d="M 50,310 L 85,278 L 85,335 L 50,350 Z" fill="#5F0E24" />
    <path d="M 450,310 L 415,278 L 415,335 L 450,350 Z" fill="#5F0E24" />
    <!-- Main Center Banner Body -->
    <path d="M 75,280 Q 250,265 425,280 L 415,335 Q 250,320 85,335 Z" fill="url(#deepRed)" stroke="url(#richGold)" stroke-width="3.5" />
    <!-- Inner Gold Foil Border on Banner -->
    <path d="M 85,288 Q 250,274 415,288" fill="none" stroke="url(#richGold)" stroke-width="1.2" />
    <path d="M 93,326 Q 250,312 407,326" fill="none" stroke="url(#richGold)" stroke-width="1.2" />
    
    <!-- Text on Ribbon -->
    <text x="250" y="313" font-family="'Cinzel', 'Oswald', 'Georgia', serif" font-weight="900" font-size="29" fill="#FFFFFF" text-anchor="middle" letter-spacing="7">
      BARBER SHOP
    </text>
  </g>

  <!-- Curved Top Header Text: "CHICAGO STYLE CUTS" -->
  <text font-family="'Cinzel', 'Oswald', 'Georgia', serif" font-weight="900" font-size="28" fill="url(#richGold)" letter-spacing="5.5" filter="url(#goldGlow)">
    <textPath href="#archTop" startOffset="50%" text-anchor="middle">
      CHICAGO STYLE CUTS
    </textPath>
  </text>

  <!-- Chicago 6-Pointed Red & Gold Stars -->
  <!-- Left Star -->
  <g transform="translate(90, 235) scale(0.7)" filter="url(#goldGlow)">
    <polygon points="25,0 31,16 47,16 34,26 39,41 25,31 11,41 16,26 3,16 19,16" fill="url(#deepRed)" stroke="url(#richGold)" stroke-width="2" />
  </g>
  <!-- Right Star -->
  <g transform="translate(375, 235) scale(0.7)" filter="url(#goldGlow)">
    <polygon points="25,0 31,16 47,16 34,26 39,41 25,31 11,41 16,26 3,16 19,16" fill="url(#deepRed)" stroke="url(#richGold)" stroke-width="2" />
  </g>

  <!-- Lower Section Details -->
  <!-- Golden Crown / Laurel at Bottom Center -->
  <g transform="translate(250, 375)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#FFE885" text-anchor="middle" letter-spacing="4">
      CARY, NC  ★  11 CHAIRS  ★  EST. 2026
    </text>
    <text x="0" y="24" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#94A3B8" text-anchor="middle" letter-spacing="2.5">
      750 E CHATHAM ST • WALK-INS WELCOME
    </text>
  </g>

  <!-- Bottom Accent Pips -->
  <circle cx="195" cy="425" r="3" fill="#E11D48" stroke="url(#richGold)" stroke-width="1" />
  <circle cx="250" cy="425" r="4.5" fill="url(#richGold)" />
  <circle cx="305" cy="425" r="3" fill="#2563EB" stroke="url(#richGold)" stroke-width="1" />
</svg>
